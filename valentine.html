<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Be My Valentine 💌</title>
<style>
body {
    height: 100vh;
    margin: 0;
    display: flex;
    justify-content: center;
    align-items: center;
    background: linear-gradient(135deg, #ff9a9e, #fad0c4);
    font-family: "Comic Sans MS", Arial, sans-serif;
    overflow: hidden;
}
.box {
    text-align: center;
    background: white;
    padding: 40px 50px;
    border-radius: 25px;
    box-shadow: 0 15px 30px rgba(0,0,0,0.2);
    z-index: 2;
    min-width: 320px;
    display: flex;
    flex-direction: column;
    align-items: center;
}
h1 { color: #e91e63; font-size: 32px; margin-bottom: 20px; }
input {
    padding: 12px;
    font-size: 18px;
    border-radius: 10px;
    border: 2px solid #f8bbd0;
    width: 80%;
    margin-bottom: 25px;
    text-align: center;
}
button {
    padding: 14px 30px;
    font-size: 20px;
    border: none;
    border-radius: 15px;
    cursor: pointer;
    margin: 10px;
}
#yes { background: #4caf50; color: white; }
#no { background: #f44336; color: white; position: absolute; transition: left 0.05s, top 0.05s; }
#result { display: none; font-size: 24px; color: #e91e63; margin-top: 15px; text-align: center; }
#gifWrapper {
    width: 220px;
    margin-top: 20px;
    border-radius: 15px;
}
#kissGif {
    width: 100%;
    max-height: 220px;
    object-fit: contain; /* Preserve GIF fully */
    transition: transform 1s ease;
    display: none;
}
.heart {
    position: absolute;
    bottom: -20px;
    font-size: 24px;
    animation: floatUp linear infinite;
    opacity: 0.8;
}
@keyframes floatUp { to { transform: translateY(-110vh) scale(1.5); opacity: 0; } }
.confetti {
    position: fixed;
    width: 10px; height: 10px;
    background-color: red;
    top: 0; left: 50%;
    opacity: 0.8;
    pointer-events: none;
    animation: confettiFall linear forwards;
}
@keyframes confettiFall { to { transform: translateY(100vh) rotate(720deg); opacity: 0; } }
</style>
</head>
<body>

<audio id="bgMusic" loop>
    <source src="song.mp3" type="audio/mpeg">
</audio>

<div class="box">
    <h1 id="question">Will you be my Valentine? 💖🥺</h1>
    <input type="text" id="nameInput" placeholder="Enter your name 💕">
    <div id="buttons">
        <button id="yes" onclick="sayYes()">Yes 💕</button>
        <button id="no">No 😝</button>
    </div>
    <div id="result"></div>
    <div id="gifWrapper">
        <img id="kissGif" src="kiss.gif" alt="Kissing gif 💋">
    </div>
</div>

<script>
const noBtn = document.getElementById("no");
const music = document.getElementById("bgMusic");

// Special boy messages (English)
const allowedBoysMessages = {
    "abhi": "Abhi 💖, you’re the reason my heart smiles every single day 🥰🏡",
    "abhimanyu": "Abhimanyu 💘, I knew you’d come, because you love me too… 😍✨",
    "abhimanyu l r": "Abhimanyu L R 💕, my forever Valentine, my heart beats only for you 🌹💫"
};

// Random messages for girls
const girlMessages = [
    "Yayyy {name}! 🥰💘 You made my Valentine’s Day special 🌹✨",
    "{name} 💕, you are my sunshine on this lovely day 🌞💖",
    "Happy Valentine’s Day, {name}! 😘 You are amazing 💫💖",
    "{name} 💖, thanks for making this day brighter 🥰🌹",
    "Roses are red, violets are blue… {name}, my heart smiles for you too! 💘"
];

// No button fun
function moveNoButton() {
    const x = Math.random() * (window.innerWidth - 150);
    const y = Math.random() * (window.innerHeight - 80);
    noBtn.style.left = x + "px";
    noBtn.style.top = y + "px";
}
noBtn.addEventListener("mouseover", moveNoButton);
noBtn.addEventListener("mousemove", moveNoButton);

let heartsInterval;
let confettiInterval;

function getRandomGirlMessage(name) {
    const msg = girlMessages[Math.floor(Math.random() * girlMessages.length)];
    return msg.replace("{name}", name);
}

function createHeart(speed = 6, colors = ["💖","💕","💘","❤️","💗"]) {
    const heart = document.createElement("div");
    heart.classList.add("heart");
    heart.innerText = colors[Math.floor(Math.random() * colors.length)];
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.animationDuration = (speed + Math.random()*3) + "s";
    document.body.appendChild(heart);
    setTimeout(()=>heart.remove(),7000);
}

// Confetti for special boy
function createConfetti() {
    const confetti = document.createElement("div");
    confetti.classList.add("confetti");
    confetti.style.backgroundColor = ['#ff0','#f0f','#0ff','#0f0','#f00'][Math.floor(Math.random()*5)];
    confetti.style.left = Math.random()*100 + "vw";
    confetti.style.animationDuration = (2+Math.random()*2) + "s";
    document.body.appendChild(confetti);
    setTimeout(()=>confetti.remove(),4000);
}

function startValentine(displayName, message, specialBoy=false) {
    // Music fade in
    music.volume = 0;
    music.play();
    let vol = 0;
    const fade = setInterval(()=>{ if(vol<0.7){ vol+=0.02; music.volume=vol;}else clearInterval(fade); },100);

    document.getElementById("question").style.display="none";
    document.getElementById("buttons").style.display="none";
    document.getElementById("nameInput").style.display="none";

    const result = document.getElementById("result");
    result.innerHTML = message;
    result.style.display="block";

    const kissGif = document.getElementById("kissGif");
    kissGif.style.display="block";

    if(specialBoy){
        kissGif.style.transform = "scale(1.2)";
        heartsInterval = setInterval(()=>createHeart(3, ["💖","❤️","💘"]), 150);
        confettiInterval = setInterval(createConfetti, 300);
    } else {
        heartsInterval = setInterval(createHeart, 250);
    }
}

// Boys redirect
function showRejectAndRedirect(){ window.location.href="focus.html"; }

async function sayYes(){
    const nameInput = document.getElementById("nameInput").value.trim();
    const name = nameInput.toLowerCase();
    if(!name){ alert("Please enter your name 💕"); return; }

    // Special boy
    if(allowedBoysMessages[name]){
        startValentine(nameInput, allowedBoysMessages[name], true);
        return;
    }

    try{
        const response = await fetch(`https://api.genderize.io/?name=${name}`);
        const data = await response.json();

        if(data.gender==="male" && data.probability>0.7){
            showRejectAndRedirect();
            return;
        }

        // Girls / unknown
        const msg = getRandomGirlMessage(nameInput);
        startValentine(nameInput, msg);

    }catch(error){
        alert("Internet chalu karo 😝 AI kaam nahi kar raha!");
    }
}
</script>
</body>
</html>
